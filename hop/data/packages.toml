flatpak  = ["com.heroicgameslauncher.hgl"]
notes    = "Heroic signs into your Epic account, downloads your library and launches games through Proton. It handles GOG and Amazon Prime games too. Games work as well as they do on Steam; the exceptions are the anti-cheat titles, Fortnite in particular."
