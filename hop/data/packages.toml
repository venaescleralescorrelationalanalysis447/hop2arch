pacman   = ["steam", "mangohud", "lib32-mangohud", "gamemode", "lib32-gamemode"]
aur      = ["protonup-qt"]
notes    = "Steam is in multilib, so enable that repo first. Turn on Steam Play for all titles in Settings and Proton runs most of your Windows library unchanged. Your existing steamapps folder can be reused if you keep the drive; check protondb.com for anything you care about, and see anticheat.toml for the multiplayer games that will not run."
confidence = "high"

