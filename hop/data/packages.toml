version = 1

# hop2arch mapping database.
#
# One [[app]] per real application. Package names were chosen conservatively:
# if a package is not certainly in the Arch official repos (core/extra/multilib)
# it is listed under aur/flatpak instead, or the entry carries a lower
# confidence. Arch merged the old community repo into extra in 2023, so any
# "community/foo" you remember is just "foo" now.
#
# Repos change. When an entry is wrong, fixing it is a two-line pull request.

# ---------------------------------------------------------------------------
# Browsers
# ---------------------------------------------------------------------------

[[app]]
id       = "firefox"
name     = "Mozilla Firefox"
strategy = "native"
tags     = ["browser"]
match    = ["mozilla firefox", "firefox"]
winget   = ["Mozilla.Firefox"]
exe      = ["firefox.exe"]
pacman   = ["firefox"]
flatpak  = ["org.mozilla.firefox"]
carry    = ["AppData/Roaming/Mozilla/Firefox/Profiles"]
notes    = "The same browser, same version numbers. Sign into Firefox Sync before you wipe Windows, or copy the profile folder into ~/.mozilla/firefox and pick it with firefox -P."
confidence = "high"

[[app]]
id       = "google-chrome"
name     = "Google Chrome"
strategy = "native"
tags     = ["browser"]
match    = ["google chrome"]
winget   = ["Google.Chrome"]
exe      = ["chrome.exe"]
aur      = ["google-chrome"]
pacman   = ["chromium"]
flatpak  = ["com.google.Chrome"]
carry    = ["AppData/Local/Google/Chrome/User Data"]
notes    = "Chrome itself is in the AUR and works normally. If you would rather stay in the official repos, chromium is the same browser without Google branding and imports the same profile."
confidence = "high"

[[app]]
id       = "microsoft-edge"
name     = "Microsoft Edge"
strategy = "native"
tags     = ["browser"]
match    = ["microsoft edge"]
winget   = ["Microsoft.Edge"]
exe      = ["msedge.exe"]
aur      = ["microsoft-edge-stable-bin"]
carry    = ["AppData/Local/Microsoft/Edge/User Data"]
notes    = "Microsoft ships a real Linux build and it syncs with your Microsoft account. It is AUR-only, so it updates when you rebuild it rather than silently in the background."
confidence = "medium"

[[app]]
id       = "brave"
name     = "Brave Browser"
strategy = "native"
tags     = ["browser"]
match    = ["brave"]
winget   = ["Brave.Brave"]
exe      = ["brave.exe"]
aur      = ["brave-bin"]
flatpak  = ["com.brave.Browser"]
carry    = ["AppData/Local/BraveSoftware/Brave-Browser/User Data"]
notes    = "brave-bin is the official upstream build repackaged, so it behaves exactly as it does on Windows. Brave Sync carries bookmarks and passwords across."
confidence = "high"

[[app]]
id       = "vivaldi"
name     = "Vivaldi"
strategy = "native"
tags     = ["browser"]
match    = ["vivaldi"]
winget   = ["VivaldiTechnologies.Vivaldi"]
exe      = ["vivaldi.exe"]
pacman   = ["vivaldi", "vivaldi-ffmpeg-codecs"]
flatpak  = ["com.vivaldi.Vivaldi"]
carry    = ["AppData/Local/Vivaldi/User Data"]
notes    = "In the official repos. Install vivaldi-ffmpeg-codecs alongside it or some streaming video will not play."
confidence = "high"

[[app]]
id       = "opera"
name     = "Opera / Opera GX"
strategy = "native"
tags     = ["browser"]
match    = ["opera", "opera gx"]
winget   = ["Opera.Opera", "Opera.OperaGX"]
exe      = ["opera.exe", "operagx.exe"]
pacman   = ["opera", "opera-ffmpeg-codecs"]
flatpak  = ["com.opera.Opera"]
carry    = ["AppData/Roaming/Opera Software/Opera Stable"]
notes    = "Plain Opera has a Linux build. Opera GX does not and there is no sign of one, so GX users land on regular Opera or Vivaldi, which has similar tab and theming controls."
confidence = "medium"

[[app]]
id       = "tor-browser"
name     = "Tor Browser"
strategy = "native"
tags     = ["browser", "privacy"]
match    = ["tor browser"]
winget   = ["TorProject.TorBrowser"]
pacman   = ["torbrowser-launcher"]
flatpak  = ["org.torproject.torbrowser-launcher"]
notes    = "torbrowser-launcher downloads and signature-checks the official bundle for you. Do not carry the old profile over; a fresh one is the point."
confidence = "high"

[[app]]
id       = "yandex-browser"
name     = "Yandex Browser"
strategy = "native"
tags     = ["browser"]
match    = ["yandex"]
winget   = ["Yandex.Browser"]
aur      = ["yandex-browser-beta"]
notes    = "Only a beta channel build is packaged in the AUR and it lags upstream. Any Chromium-based browser will import the same profile if you would rather not rely on it."
confidence = "low"

# ---------------------------------------------------------------------------
# Chat and conferencing
# ---------------------------------------------------------------------------

[[app]]
id       = "discord"
name     = "Discord"
strategy = "native"
tags     = ["chat"]
match    = ["discord"]
winget   = ["Discord.Discord"]
exe      = ["discord.exe"]
pacman   = ["discord"]
flatpak  = ["com.discordapp.Discord"]
notes    = "In the official repos. Screen sharing with audio needs Wayland plus PipeWire, which is the default on a current install, but it is the one feature worth testing early."
confidence = "high"

[[app]]
id       = "telegram"
name     = "Telegram Desktop"
strategy = "native"
tags     = ["chat"]
match    = ["telegram"]
winget   = ["Telegram.TelegramDesktop"]
exe      = ["telegram.exe"]
pacman   = ["telegram-desktop"]
flatpak  = ["org.telegram.desktop"]
carry    = ["AppData/Roaming/Telegram Desktop/tdata"]
notes    = "Official client, in the official repos. Your chats live on the server, so signing in again is enough; copying tdata only saves you a login code."
confidence = "high"

[[app]]
id       = "whatsapp"
name     = "WhatsApp"
strategy = "web"
tags     = ["chat"]
match    = ["whatsapp"]
winget   = ["WhatsApp.WhatsApp"]
aur      = ["whatsapp-for-linux"]
flatpak  = ["com.rtosta.zapzap"]
notes    = "Meta ships no Linux client. web.whatsapp.com works fully, and ZapZap or whatsapp-for-linux are community wrappers around that same page if you want a dock icon."
confidence = "high"

[[app]]
id       = "slack"
name     = "Slack"
strategy = "native"
tags     = ["chat", "work"]
match    = ["slack"]
winget   = ["SlackTechnologies.Slack"]
exe      = ["slack.exe"]
aur      = ["slack-desktop"]
flatpak  = ["com.slack.Slack"]
notes    = "Official Linux client, same features. The flatpak is the easier of the two to keep updated."
confidence = "high"

[[app]]
id       = "zoom"
name     = "Zoom"
strategy = "native"
tags     = ["chat", "work"]
match    = ["zoom"]
winget   = ["Zoom.Zoom"]
exe      = ["zoom.exe"]
aur      = ["zoom"]
flatpak  = ["us.zoom.Zoom"]
notes    = "Officially supported on Linux, including screen sharing and virtual backgrounds. Under Wayland it will ask for a screen-share permission the first time."
confidence = "high"

[[app]]
id       = "microsoft-teams"
name     = "Microsoft Teams"
strategy = "web"
tags     = ["chat", "work"]
match    = ["microsoft teams", "teams machine-wide installer"]
winget   = ["Microsoft.Teams"]
exe      = ["teams.exe"]
aur      = ["teams-for-linux"]
flatpak  = ["com.github.IsmaelMartinez.teams_for_linux"]
notes    = "Microsoft retired the Linux desktop client and points everyone at teams.microsoft.com, which supports calls and screen sharing in Chromium-based browsers. teams-for-linux is a community wrapper around that page and is what most people end up using."
confidence = "high"

[[app]]
id       = "skype"
name     = "Skype"
strategy = "none"
tags     = ["chat"]
match    = ["skype"]
winget   = ["Microsoft.Skype"]
exe      = ["skype.exe"]
notes    = "Microsoft retired Skype in May 2025 and moved consumer accounts to Teams, so this is not a Linux problem. If you still have contacts there, they are reachable through Teams free."
confidence = "high"

[[app]]
id       = "signal"
name     = "Signal"
strategy = "native"
tags     = ["chat", "privacy"]
match    = ["signal"]
winget   = ["OpenWhisperSystems.Signal"]
exe      = ["signal.exe"]
pacman   = ["signal-desktop"]
flatpak  = ["org.signal.Signal"]
notes    = "In the official repos. Desktop installs are linked to your phone, so link the new one from your phone rather than copying the old data folder."
confidence = "high"

[[app]]
id       = "element"
name     = "Element (Matrix)"
strategy = "native"
tags     = ["chat"]
match    = ["element"]
winget   = ["Element.Element"]
pacman   = ["element-desktop"]
flatpak  = ["im.riot.Riot"]
notes    = "In the official repos. Export your encryption keys from the Windows client before you wipe it, otherwise old encrypted messages will not decrypt on the new device."
confidence = "high"

[[app]]
id       = "viber"
name     = "Viber"
strategy = "native"
tags     = ["chat"]
match    = ["viber"]
winget   = ["Rakuten.Viber"]
aur      = ["viber"]
notes    = "Rakuten publishes a Linux build, packaged in the AUR. It is updated infrequently and video calls are the weakest part; the phone app remains the reliable one."
confidence = "low"

[[app]]
id       = "teamspeak"
name     = "TeamSpeak"
strategy = "native"
tags     = ["chat", "gaming"]
match    = ["teamspeak"]
winget   = ["TeamSpeakSystems.TeamSpeakClient"]
pacman   = ["teamspeak3"]
flatpak  = ["com.teamspeak.TeamSpeak"]
notes    = "The TeamSpeak 3 client is packaged and works, including overlay-free voice in games. Copy your bookmarks and identity from AppData/Roaming/TS3Client so you keep server permissions."
confidence = "medium"

[[app]]
id       = "mumble"
name     = "Mumble"
strategy = "native"
tags     = ["chat", "gaming"]
match    = ["mumble"]
winget   = ["Mumble.Mumble"]
pacman   = ["mumble"]
flatpak  = ["info.mumble.Mumble"]
notes    = "Same application, in the official repos. Export your certificate from the Windows client first or you will look like a new user to every server."
confidence = "high"

# ---------------------------------------------------------------------------
# Development
# ---------------------------------------------------------------------------

[[app]]
id       = "vscode"
name     = "Visual Studio Code"
strategy = "native"
tags     = ["dev", "editor"]
match    = ["visual studio code"]
winget   = ["Microsoft.VisualStudioCode"]
exe      = ["code.exe"]
pacman   = ["code"]
aur      = ["visual-studio-code-bin"]
flatpak  = ["com.visualstudio.code"]
carry    = ["AppData/Roaming/Code/User"]
notes    = "The repo package code is the MIT-licensed OSS build; visual-studio-code-bin in the AUR is the Microsoft-branded one with the marketplace and Remote/Copilot extensions. Pick the AUR build if you rely on those. Settings Sync moves everything either way."
confidence = "high"

[[app]]
id       = "vscodium"
name     = "VSCodium"
strategy = "native"
tags     = ["dev", "editor"]
match    = ["vscodium"]
winget   = ["VSCodium.VSCodium"]
exe      = ["codium.exe"]
aur      = ["vscodium-bin"]
flatpak  = ["com.vscodium.codium"]
carry    = ["AppData/Roaming/VSCodium/User"]
notes    = "Same telemetry-free build you are already running, just packaged for Arch."
confidence = "high"

[[app]]
id       = "visual-studio"
name     = "Visual Studio (2019/2022)"
strategy = "none"
tags     = ["dev", "ide", "blocker"]
match    = ["visual studio 2019", "visual studio 2022", "visual studio community", "visual studio professional", "visual studio enterprise"]
winget   = ["Microsoft.VisualStudio.2022.Community"]
notes    = "Visual Studio proper does not exist on Linux and Wine does not run it. For C# and .NET, JetBrains Rider is the closest full IDE and the .NET SDK itself is packaged; for C++ workloads people move to CLion, Qt Creator or VS Code with clangd. If you need the real thing, keep a Windows VM."
confidence = "high"

[[app]]
id       = "intellij-idea"
name     = "IntelliJ IDEA"
strategy = "native"
tags     = ["dev", "ide", "jetbrains"]
match    = ["intellij idea"]
winget   = ["JetBrains.IntelliJIDEA.Community", "JetBrains.IntelliJIDEA.Ultimate"]
pacman   = ["intellij-idea-community-edition"]
aur      = ["intellij-idea-ultimate-edition"]
flatpak  = ["com.jetbrains.IntelliJ-IDEA-Community"]
carry    = ["AppData/Roaming/JetBrains"]
notes    = "Community edition is in the official repos; Ultimate is in the AUR or via JetBrains Toolbox. Settings Sync through your JetBrains account carries keymaps and plugins across."
confidence = "high"

[[app]]
id       = "pycharm"
name     = "PyCharm"
strategy = "native"
tags     = ["dev", "ide", "jetbrains"]
match    = ["pycharm"]
winget   = ["JetBrains.PyCharm.Community", "JetBrains.PyCharm.Professional"]
pacman   = ["pycharm-community-edition"]
aur      = ["pycharm-professional"]
flatpak  = ["com.jetbrains.PyCharm-Community"]
carry    = ["AppData/Roaming/JetBrains"]
notes    = "Community edition is packaged in the official repos, Professional comes from the AUR or Toolbox. Interpreters are easier here than on Windows: python and python-virtualenv are one pacman command away."
confidence = "high"

[[app]]
id       = "webstorm"
name     = "WebStorm"
strategy = "native"
tags     = ["dev", "ide", "jetbrains"]
match    = ["webstorm"]
winget   = ["JetBrains.WebStorm"]
aur      = ["webstorm"]
carry    = ["AppData/Roaming/JetBrains"]
notes    = "Not in the official repos, so install it through JetBrains Toolbox or the AUR package. Toolbox is the lower-maintenance option because it handles its own updates."
confidence = "medium"

[[app]]
id       = "rider"
name     = "JetBrains Rider"
strategy = "native"
tags     = ["dev", "ide", "jetbrains", "dotnet"]
match    = ["jetbrains rider", "rider"]
winget   = ["JetBrains.Rider"]
aur      = ["rider"]
carry    = ["AppData/Roaming/JetBrains"]
notes    = "Rider is the practical replacement for Visual Studio on Linux and it is free for non-commercial use. It builds and debugs .NET fine; only Windows-only workloads like WinForms designers and MSIX packaging are missing."
confidence = "medium"

[[app]]
id       = "clion"
name     = "CLion"
strategy = "native"
tags     = ["dev", "ide", "jetbrains"]
match    = ["clion"]
winget   = ["JetBrains.CLion"]
aur      = ["clion"]
carry    = ["AppData/Roaming/JetBrains"]
notes    = "Install through JetBrains Toolbox or the AUR. CMake, gcc and gdb come from the base-devel group, so toolchain setup is shorter than it was on Windows."
confidence = "medium"

[[app]]
id       = "datagrip"
name     = "DataGrip"
strategy = "native"
tags     = ["dev", "database", "jetbrains"]
match    = ["datagrip"]
winget   = ["JetBrains.DataGrip"]
aur      = ["datagrip"]
carry    = ["AppData/Roaming/JetBrains"]
notes    = "AUR or JetBrains Toolbox. If you would rather not pay, DBeaver in the official repos covers most of the same ground."
confidence = "medium"

[[app]]
id       = "jetbrains-toolbox"
name     = "JetBrains Toolbox"
strategy = "native"
tags     = ["dev", "jetbrains"]
match    = ["jetbrains toolbox"]
winget   = ["JetBrains.Toolbox"]
aur      = ["jetbrains-toolbox"]
notes    = "Works the same as on Windows and is the simplest way to run the paid IDEs, since it updates them outside of pacman."
confidence = "high"

[[app]]
id       = "sublime-text"
name     = "Sublime Text"
strategy = "native"
tags     = ["dev", "editor"]
match    = ["sublime text"]
winget   = ["SublimeHQ.SublimeText.4"]
exe      = ["sublime_text.exe"]
aur      = ["sublime-text-4"]
carry    = ["AppData/Roaming/Sublime Text/Packages/User"]
notes    = "Official Linux build, packaged in the AUR. Copy the Packages/User folder into ~/.config/sublime-text/Packages/User and your keymaps, snippets and Package Control list come with you."
confidence = "high"

[[app]]
id       = "notepad-plus-plus"
name     = "Notepad++"
strategy = "alternative"
tags     = ["dev", "editor"]
match    = ["notepad++"]
winget   = ["Notepad++.Notepad++"]
exe      = ["notepad++.exe"]
replacement = "Kate"
pacman   = ["kate", "featherpad", "gnome-text-editor"]
aur      = ["notepadqq"]
notes    = "There is no Linux Notepad++. Kate is the usual landing spot: tabs, sessions, column select, macros and a built-in terminal. Notepadqq deliberately imitates the Notepad++ layout if muscle memory matters more than polish."
confidence = "high"

[[app]]
id       = "neovim"
name     = "Neovim"
strategy = "native"
tags     = ["dev", "editor"]
match    = ["neovim"]
winget   = ["Neovim.Neovim"]
exe      = ["nvim.exe"]
pacman   = ["neovim"]
carry    = ["AppData/Local/nvim"]
notes    = "Copy AppData/Local/nvim to ~/.config/nvim and your config starts working immediately. Plugins that shelled out to PowerShell are the only thing you will need to touch."
confidence = "high"

[[app]]
id       = "git"
name     = "Git for Windows"
strategy = "native"
tags     = ["dev", "vcs"]
match    = ["git", "git for windows"]
winget   = ["Git.Git"]
exe      = ["git.exe"]
pacman   = ["git", "git-lfs"]
carry    = [".gitconfig", ".ssh"]
notes    = "Git is the same tool without the bundled MSYS layer, and the shell you were using Git Bash to get is now just your terminal. Copy .gitconfig and .ssh across, then chmod 600 the keys or ssh will refuse them."
confidence = "high"

[[app]]
id       = "github-desktop"
name     = "GitHub Desktop"
strategy = "native"
tags     = ["dev", "vcs"]
match    = ["github desktop"]
winget   = ["GitHub.GitHubDesktop"]
aur      = ["github-desktop-bin"]
flatpak  = ["io.github.shiftey.Desktop"]
notes    = "GitHub does not build for Linux, but the community fork in the AUR and on Flathub is the same app and signs into the same account."
confidence = "medium"

[[app]]
id       = "gitkraken"
name     = "GitKraken"
strategy = "native"
tags     = ["dev", "vcs"]
match    = ["gitkraken"]
winget   = ["Axosoft.GitKraken"]
aur      = ["gitkraken"]
flatpak  = ["com.axosoft.GitKraken"]
notes    = "Officially supported on Linux with the same licence you already have."
confidence = "high"

[[app]]
id       = "sourcetree"
name     = "Sourcetree"
strategy = "alternative"
tags     = ["dev", "vcs"]
match    = ["sourcetree"]
winget   = ["Atlassian.Sourcetree"]
replacement = "GitKraken or git-cola"
pacman   = ["git-cola", "gitg", "lazygit"]
aur      = ["gitkraken"]
notes    = "Atlassian never shipped Sourcetree for Linux. GitKraken is the closest visual equivalent; git-cola and gitg are lighter and free, and lazygit is the terminal option people tend to settle on."
confidence = "high"

[[app]]
id       = "docker-desktop"
name     = "Docker Desktop"
strategy = "native"
tags     = ["dev", "containers"]
match    = ["docker desktop"]
winget   = ["Docker.DockerDesktop"]
exe      = ["docker desktop.exe"]
pacman   = ["docker", "docker-compose", "docker-buildx"]
aur      = ["docker-desktop"]
notes    = "On Linux, Docker runs directly on your kernel with no VM in between, so it is faster and lighter than what you had. Install docker, enable docker.service, add yourself to the docker group. The Desktop GUI exists in the AUR but very few people bother."
confidence = "high"

[[app]]
