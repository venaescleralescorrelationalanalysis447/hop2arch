notes    = "Drivers come from the repos and update with the rest of the system, so there is no separate updater to run. nvidia-settings covers displays and G-Sync, GreenWithEnvy adds fan and clock control. ShadowPlay-style recording is replaced by OBS with NVENC, and there is no game-optimisation feature; you set graphics options yourself."
confidence = "high"

