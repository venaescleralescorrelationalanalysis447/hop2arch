# Anti-cheat and game compatibility snapshot.
#
# This file is a point-in-time snapshot, not a live feed. Anti-cheat support is
# a publisher policy switch: Easy Anti-Cheat and BattlEye both have Proton
# support that the game's publisher has to turn on, and either of them can be
# turned off again in a patch. Apex Legends worked for years and then stopped.
#
# ProtonDB (protondb.com) and areweanticheatyet.com are the live sources of
# truth. Check them for anything you actually care about before you commit to
# wiping Windows.
#
# status values:
#   blocked - anti-cheat or publisher policy refuses to run on Linux at all
#   broken  - it launches, but a mode you probably care about does not work
#   works   - plays on Proton or has a native Linux build
#   unknown - genuinely contested or changes often; go and check

# ---------------------------------------------------------------------------
# Blocked
# ---------------------------------------------------------------------------

[[title]]
appid  = 0
name   = "VALORANT"
status = "blocked"
reason = "Riot Vanguard is a kernel-mode anti-cheat that loads at boot. Riot has said plainly it will not support Linux. There is no workaround and trying one gets you banned."

[[title]]
appid  = 0
name   = "League of Legends"
status = "blocked"
reason = "Ran fine on Proton for years, then Riot added Vanguard in 2024 and it stopped. Same kernel driver as VALORANT, same answer."

[[title]]
appid  = 0
name   = "Fortnite"
status = "blocked"
reason = "Epic owns Easy Anti-Cheat and ships the Proton-compatible version to other studios, but has chosen not to enable it for Fortnite. This is a policy decision, not a technical limit."

