name: Something else went wrong
description: A bug in hop plan, hop land, hop go, hop install or the CLI
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If hop ended a message with a traceback, that is a bug in `hop/cli.py` by its own
        docstring — a failure is supposed to arrive as a sentence. Please include the whole
        thing.

        **If it involves losing data or selecting the wrong disk, do not open a public issue.**
        See [SECURITY.md](https://github.com/Ramirmir/hop2arch/blob/main/SECURITY.md).

  - type: dropdown
    id: command
    attributes:
      label: Which command
      options:
        - hop go
        - hop install
        - hop plan
        - hop report
        - hop land
        - hop install-config
        - hop diff
        - hop doctor
        - hop scrub
        - hop db
        - something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What you ran, and what happened
      description: The exact command line, then the output. Say what you expected if it is not obvious.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Output of `hop --version`
      placeholder: hop2arch 0.1.0
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11 26100, Python 3.12.4 — or Arch, kernel 6.9, Python 3.12
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: The plan or hopfile involved
      description: |
        Optional, but usually what settles it. Run `hop scrub` on a hopfile first. A plan
        contains your hostname, account name and package list — check it before pasting.
