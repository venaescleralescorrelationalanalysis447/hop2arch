name: A program is missing or mapped wrong
description: hop had no opinion on a program, or gave the wrong one
title: "mapping: "
labels: ["mapping"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful kind of issue, and the easiest to turn into a pull request —
        an entry in `hop/data/packages.toml` is a few lines of TOML. If you would rather send
        the fix directly, [CONTRIBUTING.md](https://github.com/Ramirmir/hop2arch/blob/main/CONTRIBUTING.md)
        has the field reference and the two rules that get one merged.

  - type: input
    id: program
    attributes:
      label: The program, as Windows names it
      description: Copy the display name exactly, including any (x64) or language suffix.
      placeholder: Notepad++ (64-bit x64)
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - hop had no opinion — it was in "Not in the database"
        - hop matched the wrong entry
        - The entry exists but the notes are wrong or misleading
        - The suggested package does not exist or does not work
        - The strategy is wrong (e.g. it says alternative, but there is no path)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What the answer should be
      description: |
        The Arch package if you know it, or "there is no path" if that is the truth — that is
        a legitimate answer here and the report has a section for it. If you are not sure,
        say so; `confidence = "low"` exists for exactly this.
      placeholder: |
        Kate covers most of it, from the official repos. Notepadqq imitates the layout more
        closely but is less maintained. Column select and macros both survive; the plugin
        ecosystem does not.
    validations:
      required: true

  - type: textarea
    id: entry
    attributes:
      label: What hop said, if it said anything
      description: The row or bullet from your report. Optional.
      render: markdown

  - type: checkboxes
    id: checked
    attributes:
      label: Before opening
      options:
        - label: I ran `hop db search <name>` and this is not already covered
        - label: I have not pasted an unscrubbed hopfile here
