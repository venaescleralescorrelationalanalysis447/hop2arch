name: The scanner failed or produced something wrong
description: hop-scan.ps1 stopped, or the hopfile does not describe your machine
title: "scan: "
labels: ["scanner"]
body:
  - type: markdown
    attributes:
      value: |
        `windows/hop-scan.ps1` has never been run end to end on a machine outside CI, so a
        report here is genuinely useful rather than a formality. It parses under Windows
        PowerShell 5.1 and its pure helpers are unit-tested, but neither of those is the same
        as reading a real registry.

        **Before you attach anything:** run `hop scrub hopfile.json`. It replaces hostnames,
        account names, e-mail addresses, Wi-Fi SSIDs, public keys and drive labels with stable
        stand-ins and drops the payload index entirely, and it prints the replacement table so
        you can check it. It is redaction, not anonymity — an unusual set of installed software
        identifies a machine on its own.

  - type: dropdown
    id: what
    attributes:
      label: What happened
      options:
        - The script stopped with an error
        - It finished, but a section of the hopfile is empty or wrong
        - It finished, but took an unreasonable amount of time
        - The hopfile is written but hop plan will not read it
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: The error, or the part of the hopfile that is wrong
      description: Paste it as it appeared. A screenshot of a terminal is harder to read than text.
      render: text
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: The exact command you ran
      placeholder: powershell -NoProfile -ExecutionPolicy Bypass -File windows\hop-scan.ps1 -NoPayload
    validations:
      required: true

  - type: input
    id: psversion
    attributes:
      label: Output of `$PSVersionTable.PSVersion`
      placeholder: 5.1.26100.8875
    validations:
      required: true

  - type: dropdown
    id: elevated
    attributes:
      label: Were you running as administrator?
      description: |
        The script is meant to work either way — anything needing elevation should degrade into
        a warning rather than stopping. If it stopped instead, that is the bug.
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: textarea
    id: hopfile
    attributes:
      label: The scrubbed hopfile
      description: Output of `hop scrub hopfile.json`. Attach the file or paste it. Optional but it usually decides the issue.

  - type: checkboxes
    id: scrubbed
    attributes:
      label: Confirm
      options:
        - label: Anything I attached went through `hop scrub` first
          required: true
